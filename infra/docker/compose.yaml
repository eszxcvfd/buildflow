name: buildflow

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
    driver: local

services:
  postgres:
    image: postgres:16.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  redis:
    image: redis:7.2.5-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  api:
    build:
      context: ../../src/api
      dockerfile: Dockerfile
    image: buildflow-api:local
    restart: unless-stopped
    environment:
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
    ports:
      - "127.0.0.1:${API_PORT:-3000}:3000"
    networks: [internal]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health/live || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 15s

  web:
    build:
      context: ../../src/web
      dockerfile: Dockerfile
    image: buildflow-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:3000
      NEXT_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "127.0.0.1:${WEB_PORT:-3001}:3001"
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3001/ || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  mobile:
    build:
      context: ../../src/mobile
      dockerfile: Dockerfile
    image: buildflow-mobile:local
    restart: unless-stopped
    environment:
      EXPO_PUBLIC_API_URL: http://localhost:3000
    ports:
      - "127.0.0.1:${MOBILE_PORT:-19006}:19006"
    networks: [internal]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:19006/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
